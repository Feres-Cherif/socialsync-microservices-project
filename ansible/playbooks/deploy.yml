---
- name: Déployer SocialSync avec Docker Compose
  hosts: socialsync
  gather_facts: false
  vars:
    project_dir: "{{ playbook_dir }}/../.."
    frontend_port: 8080

  tasks:
    - name: Vérifier Docker Compose v2
      ansible.builtin.command: docker compose version
      register: compose_version
      changed_when: false

    - name: Afficher la version
      ansible.builtin.debug:
        msg: "{{ compose_version.stdout }}"

    - name: Créer .env à partir de .env.example (si absent)
      ansible.builtin.copy:
        src: "{{ project_dir }}/.env.example"
        dest: "{{ project_dir }}/.env"
        remote_src: true
        force: false
        mode: "0600"

    - name: Construire et démarrer les conteneurs
      ansible.builtin.command:
        cmd: docker compose up --build -d
        chdir: "{{ project_dir }}"
      changed_when: true

    - name: Attendre que le frontend réponde
      ansible.builtin.uri:
        url: "http://localhost:{{ frontend_port }}"
        status_code: 200
      register: front
      until: front.status == 200
      retries: 30
      delay: 5

    - name: Lister les conteneurs
      ansible.builtin.command:
        cmd: docker compose ps
        chdir: "{{ project_dir }}"
      register: ps
      changed_when: false

    - name: Afficher l'état
      ansible.builtin.debug:
        var: ps.stdout_lines
